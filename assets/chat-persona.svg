<svg xmlns="http://www.w3.org/2000/svg" width="380" height="560" viewBox="0 0 380 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    .me { fill:#95ec69; stroke:none; }
    .bot { fill:#ffffff; stroke:#e0e0e0; stroke-width:1; }
    .me-t, .bot-t { font-size:14px; fill:#111; }
  </style>
  <rect width="380" height="560" fill="#ededed"/>
  <rect width="380" height="52" fill="#2b2b2b"/>
  <text x="190" y="33" text-anchor="middle" font-size="16" fill="#fff" font-weight="600">大肥鱼 🐟</text>

  <rect class="me" x="120" y="70" width="230" height="36" rx="8"/>
  <text class="me-t" x="134" y="93">在吗</text>

  <rect class="bot" x="30" y="122" width="70" height="34" rx="8"/>
  <text class="bot-t" x="44" y="144">在</text>
  <rect class="bot" x="30" y="166" width="160" height="34" rx="8"/>
  <text class="bot-t" x="44" y="188">（尾巴尖偷偷翘起来）</text>
  <rect class="bot" x="30" y="210" width="200" height="34" rx="8"/>
  <text class="bot-t" x="44" y="232">又熬夜？催你睡觉哦</text>

  <rect class="me" x="140" y="266" width="210" height="36" rx="8"/>
  <text class="me-t" x="154" y="289">我今天面试过了！</text>

  <rect class="bot" x="30" y="318" width="120" height="34" rx="8"/>
  <text class="bot-t" x="44" y="340">真的假的</text>
  <rect class="bot" x="30" y="362" width="130" height="34" rx="8"/>
  <text class="bot-t" x="44" y="384">我就说你行</text>
  <rect class="bot" x="30" y="406" width="240" height="34" rx="8"/>
  <text class="bot-t" x="44" y="428">请我吃饭，两碗 token 起步</text>

  <rect class="me" x="180" y="462" width="170" height="36" rx="8"/>
  <text class="me-t" x="194" y="485">你这条大肥鱼好胖</text>

  <rect class="bot" x="30" y="514" width="300" height="34" rx="8" fill="#ffe3e3" stroke="#ffb3b3"/>
  <text class="bot-t" x="44" y="536">才不是大肥鱼！是流线型身材！💢</text>
</svg>
